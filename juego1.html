<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego 1 - Número Mayor</title>
<link rel="stylesheet" href="css/estilo_juego.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="contenedor">

<h1>🎮 Juego 1</h1>

<h2>Arrastra el número MAYOR al cofre</h2>

<div class="numeros">

<div class="numero"
draggable="true"
id="3250"
ondragstart="drag(event)"
onclick="leerNumero('tres mil doscientos cincuenta')">
3250
</div>

<div class="numero"
draggable="true"
id="4521"
ondragstart="drag(event)"
onclick="leerNumero('cuatro mil quinientos veintiuno')">
4521
</div>

</div>

<div class="zona"
ondrop="drop(event)"
ondragover="allowDrop(event)">
🏆 MAYOR
</div>

<div id="mensaje"></div>

<br>

<button id="siguiente"
onclick="window.location.href='juego2.html'">
➡️ Siguiente Nivel
</button>

</div>
<script src="js/script_juego.js"></script>


</body>
</html>
