<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego 1 - Número Mayor</title>

<link rel="stylesheet" href="css/estilo_actividad2.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div class="contenedor">

<h1>🏰 REINO DE LOS NÚMEROS 🏰</h1>

<h2>🎮 Juego 1: Número Mayor</h2>

<div class="perfil">

<img id="avatar" src="" class="avatar">

<h3 id="nombre"></h3>

<h3 id="puntaje">⭐ Puntaje: 0</h3>

</div>

<h2>Arrastra el número MAYOR al cofre</h2>

<div class="numeros">

<div
class="numero"
id="3250"
draggable="true"
onclick="leerNumero('tres mil doscientos cincuenta')"
ondragstart="drag(event)">
3250
</div>

<div
class="numero"
id="4521"
draggable="true"
onclick="leerNumero('cuatro mil quinientos veintiuno')"
ondragstart="drag(event)">
4521
</div>

</div>

<div
class="zona"
id="zonaRespuesta"
ondrop="drop(event)"
ondragover="allowDrop(event)">

🏆 MAYOR

</div>

<div id="mensaje"></div>

<button
id="btnVerificar"
onclick="verificarRespuesta()">

✅ Verificar Respuesta

</button>

<br><br>

<button
id="btnSiguiente"
onclick="window.location.href='actividad3.html'">

➡️ Siguiente Nivel

</button>

</div>

<script src="js/script_actividad2.js"></script>

</body>
</html>
